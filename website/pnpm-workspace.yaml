# Makes this directory its own workspace root. The repository root only claims
# packages/*, so the docs site was never part of it — but without this file pnpm
# walks up, finds the root manifest, and the site has to be installed with
# --ignore-workspace. That flag also discards the allowBuilds list, and pnpm 11
# treats a refused build script as an error, so the deploy failed on esbuild
# while a local pnpm 10 install passed.
allowBuilds:
  # Astro's bundler.
  esbuild: true
  # Pulled in by wrangler, which cloudflare/wrangler-action installs into this
  # directory at deploy time. Its native binary comes from an install script, so
  # refusing it fails the deploy after a green build.
  workerd: true
