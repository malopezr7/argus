name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

# The job builds a static site and hands the output to Cloudflare. It writes
# nothing back here — no comment, no ref, no release — so `contents: read` is
# the whole grant it needs.
permissions:
  contents: read

# A newer commit on main makes an in-flight deploy obsolete rather than
# something to finish. Deploys are not cancelled mid-upload only to be safe:
# Pages serves the previous deployment until a new one completes.
concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Reading the secret here rather than in an `if:` on each step: secrets are
    # not available in job-level `if` expressions, but they are in `env`.
    env:
      HAS_CLOUDFLARE_CREDENTIALS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}

    steps:
      # `persist-credentials: false` keeps the job token out of .git/config.
      # `pnpm install` runs build scripts (sharp), and a token left on disk is
      # readable by any code that runs after checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report missing credentials
        if: env.HAS_CLOUDFLARE_CREDENTIALS != 'true'
        run: |
          echo "::notice::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set — skipping the deploy."
          echo "Add them under Settings -> Secrets and variables -> Actions to enable it."

      # pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.HAS_CLOUDFLARE_CREDENTIALS == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.HAS_CLOUDFLARE_CREDENTIALS == 'true'
        with:
          node-version: 24

      # `--ignore-workspace` because website/ is deliberately outside the pnpm
      # workspace: it has its own lockfile and must not pull in the runner's
      # dependency graph.
      - name: Install dependencies
        if: env.HAS_CLOUDFLARE_CREDENTIALS == 'true'
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Build
        if: env.HAS_CLOUDFLARE_CREDENTIALS == 'true'
        working-directory: website
        run: pnpm build

      - name: Deploy
        if: env.HAS_CLOUDFLARE_CREDENTIALS == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: pages deploy dist --project-name argus-hermes --branch main
