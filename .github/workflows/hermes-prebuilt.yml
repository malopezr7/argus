name: Hermes prebuilt

# Builds the standalone Hermes VM from source for every platform Argus ships a
# prebuilt for, gates each build on bytecode parity with the compiler React
# Native itself ships, and optionally publishes the results as a GitHub Release.
#
# Manual dispatch only. Each run is several minutes of compute per platform, and
# a build triggered by an unrelated push would be waste rather than signal.
#
# The assets are versioned by the HERMES version, never by the Argus version,
# and are not dependencies of any Argus package — which Hermes a user needs
# depends on their React Native version, not on which Argus they installed. A
# release on a public repository serves that with no authentication, no
# practical size limit, and a CDN in front.

on:
  workflow_dispatch:
    inputs:
      hermes_tag:
        description: 'facebook/hermes git tag, e.g. hermes-v250829098.0.16'
        required: true
        type: string
      publish:
        description: 'Publish a GitHub Release once every platform has built and passed'
        required: false
        type: boolean
        default: false
      overwrite:
        description: >-
          Replace an existing release for this tag. Off by default: users pin
          checksums against published bytes, so replacing them is a decision,
          not an accident.
        required: false
        type: boolean
        default: false

# Read-only by default. The publish job elevates itself, and only itself.
permissions:
  contents: read

# Two runs of the same tag would race to publish identical versions.
concurrency:
  group: hermes-prebuilt-${{ inputs.hermes_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.slug }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    # Restated rather than inherited. These jobs compile third-party C++ through
    # CMake, which is the widest arbitrary-code surface in the repository, so
    # what they are allowed to do should be readable without scrolling up — and
    # should not silently widen if the workflow default ever changes.
    permissions:
      contents: read

    strategy:
      # One platform failing should not hide whether the others are healthy.
      fail-fast: false
      matrix:
        include:
          # macOS builds ONE universal binary and slices it into two packages,
          # so a user downloads roughly half a universal binary instead of all
          # of it. `cpu` is the runner's own architecture, used for verification;
          # `slices` are the packages cut from that single build.
          - slug: darwin
            runner: macos-latest
            os: darwin
            cpu: arm64
            slices: arm64 x64
          # Deliberately the OLDEST supported runner, not `-latest`. A glibc
          # binary refuses to start on any system whose glibc is older than the
          # one it was linked against, so the build host sets the floor for every
          # user. Built on 24.04 these required glibc 2.38, which excludes Ubuntu
          # 22.04 LTS and Debian 12 — and CI never noticed, because CI runs on
          # the same 24.04 that produced them. 22.04 lowers the floor to 2.35.
          # Alpine and other musl distributions are out of reach either way.
          - slug: linux-x64
            runner: ubuntu-22.04
            os: linux
            cpu: x64
            slices: x64
          - slug: linux-arm64
            runner: ubuntu-22.04-arm
            os: linux
            cpu: arm64
            slices: arm64

    steps:
      # `persist-credentials: false` keeps the job token out of .git/config.
      # This job then runs pnpm build scripts and a full CMake build of source
      # fetched from another repository; none of that needs a token, and a
      # token on disk is readable by everything that runs after checkout.
      # The Hermes clone is an unauthenticated public HTTPS clone.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install cmake and ninja
        shell: bash
        run: |
          if command -v cmake >/dev/null && command -v ninja >/dev/null; then
            echo "cmake and ninja already present on the runner image"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install cmake ninja
          else
            sudo apt-get update
            sudo apt-get install -y cmake ninja-build
          fi
          cmake --version | head -1
          ninja --version

      # Builds through SourceBuildAdapter — the same path a user without a
      # published prebuilt takes — so CI cannot drift from what users run.
      - name: Build Hermes
        id: build
        shell: bash
        env:
          HERMES_TAG: ${{ inputs.hermes_tag }}
        run: pnpm exec tsx scripts/build-hermes.ts --tag "$HERMES_TAG"

      # Every gate here is a hard failure. The load-bearing one is bytecode
      # parity: the freshly built hermesc and the official hermes-compiler npm
      # package must emit a byte-identical .hbc for the same source.
      - name: Verify build
        shell: bash
        env:
          BIN_DIR: ${{ steps.build.outputs.bin-dir }}
          HERMES_TAG: ${{ inputs.hermes_tag }}
          TARGET_OS: ${{ matrix.os }}
          TARGET_CPU: ${{ matrix.cpu }}
        run: |
          pnpm exec tsx scripts/verify-hermes-build.ts \
            --bin-dir "$BIN_DIR" \
            --tag "$HERMES_TAG" \
            --os "$TARGET_OS" \
            --cpu "$TARGET_CPU"

      - name: Package
        shell: bash
        env:
          BIN_DIR: ${{ steps.build.outputs.bin-dir }}
          HERMES_TAG: ${{ inputs.hermes_tag }}
          TARGET_OS: ${{ matrix.os }}
          SLICES: ${{ matrix.slices }}
        run: |
          # --thin slices one architecture out of a universal binary, which is a
          # macOS concept and the reason macOS produces two archives from one build.
          extra=()
          if [ "$TARGET_OS" = "darwin" ]; then extra+=(--thin); fi

          for cpu in $SLICES; do
            pnpm exec tsx scripts/pack-hermes-release.ts \
              --bin-dir "$BIN_DIR" \
              --tag "$HERMES_TAG" \
              --os "$TARGET_OS" \
              --cpu "$cpu" \
              --out "$GITHUB_WORKSPACE/dist/hermes-bin" \
              "${extra[@]}"
          done

          ls -l "$GITHUB_WORKSPACE/dist/hermes-bin"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hermes-bin-${{ matrix.slug }}
          path: |
            dist/hermes-bin/*.tar.gz
            dist/hermes-bin/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    # `needs` waits for every matrix job AND requires all of them to have
    # succeeded, so a release can never be cut from a partial set of platforms.
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The only elevated permissions in the workflow, scoped to the one job that
    # needs them. This job downloads already-built archives and calls the API;
    # it compiles nothing, which is why it is the job that holds the signing
    # capability rather than the three build jobs.
    permissions:
      # Creating a release is a write to repository contents.
      contents: write
      # Mints the short-lived OIDC token the provenance attestation is signed
      # with. This is a credential that speaks for the repository, so it stays
      # out of any job that runs a third-party build.
      id-token: write
      # Stores the resulting attestation against the repository.
      attestations: write

    # A GitHub Environment, so publishing is held behind required reviewers.
    environment: hermes-prebuilt-publish

    steps:
      # Nothing in this job uses git over the network — `gh` authenticates from
      # GH_TOKEN in the environment — so the token has no reason to sit in
      # .git/config where the pnpm build scripts below could read it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: hermes-bin-*
          merge-multiple: true

      # Names, tag and body all come from @arguslab/core, which is also where the
      # provisioning chain derives the download URL — so what CI publishes and
      # what a user fetches cannot be named differently.
      - name: Derive release identity
        id: meta
        shell: bash
        env:
          HERMES_TAG: ${{ inputs.hermes_tag }}
        run: |
          pnpm exec tsx scripts/hermes-release-meta.ts \
            --tag "$HERMES_TAG" --notes-out "$RUNNER_TEMP/release-notes.md"

      - name: Verify checksums and asset set
        shell: bash
        working-directory: dist
        env:
          EXPECTED: ${{ steps.meta.outputs.asset-count }}
        run: |
          ls -l

          # The .sha256 files name their archive with no path, so verify from
          # the directory holding both.
          for checksum in *.tar.gz.sha256; do
            shasum -a 256 -c "$checksum"
          done

          found=$(ls -1 *.tar.gz | wc -l | tr -d ' ')
          if [ "$found" != "$EXPECTED" ]; then
            echo "expected $EXPECTED archives, found $found — refusing to publish a partial release" >&2
            exit 1
          fi

          # One aggregate file so a human verifies the whole release in one
          # command; sorted so re-running produces identical bytes.
          cat *.tar.gz.sha256 | sort > checksums.txt
          cat checksums.txt

      # Signed provenance for the exact bytes about to be published: a
      # verifiable statement that these archives came out of this workflow, in
      # this repository, at this commit.
      #
      # This is the part checksums cannot do. A .sha256 proves an archive was
      # not corrupted between the release page and the user's disk; it proves
      # nothing about origin, because anyone substituting an archive
      # substitutes the .sha256 next to it. The attestation is signed against a
      # public transparency log and does not travel with the file, so it cannot
      # be forged by replacing what is served. For a project whose whole
      # deliverable here is an executable, that is the guarantee that matters.
      #
      # Attested before the release is created, so the failure mode is a
      # release that does not happen rather than a published binary nobody can
      # verify. Only the archives are attested — the checksum files are
      # metadata about them, not artifacts anyone executes.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*.tar.gz

      # Re-running for a tag that is already published is refused unless the
      # dispatcher opted in. Users pin checksums against published bytes, and a
      # release that is half old and half new is worse than either. With
      # `overwrite` the old release is deleted and a new one created in a single
      # command carrying every asset, so a release is never patched in place.
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.release-tag }}
          RELEASE_TITLE: ${{ steps.meta.outputs.release-title }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$OVERWRITE" != "true" ]; then
              echo "release $RELEASE_TAG already exists." >&2
              echo "Re-run with 'overwrite' enabled to replace it." >&2
              exit 1
            fi
            echo "replacing existing release $RELEASE_TAG"
            gh release delete "$RELEASE_TAG" --yes --cleanup-tag
          fi

          # --latest=false keeps the repository's "Latest" badge pointing at an
          # Argus release. These are production artifacts rather than
          # prereleases, so marking them unstable would be a lie; they simply
          # are not the thing a human visiting the repo is looking for.
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TITLE" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest=false \
            dist/*.tar.gz dist/*.tar.gz.sha256 dist/checksums.txt

          gh release view "$RELEASE_TAG"
