name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  ci:
    name: Typecheck, Check, Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Check (Biome lint + format)
        run: pnpm check

      # Integration tests are gated on a local Hermes binary (.hermes/hermes),
      # which is not committed — they skip automatically in CI.
      - name: Test
        run: pnpm test
