name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# This workflow only reads the repository: it typechecks, lints and tests.
# Nothing here comments on a pull request, publishes, or writes a ref, so
# anything beyond `contents: read` would be a standing grant nobody needs.
permissions:
  contents: read

jobs:
  ci:
    name: Typecheck, Check, Test
    runs-on: ubuntu-latest

    steps:
      # `persist-credentials: false` keeps the job token out of .git/config.
      # `pnpm install` runs the build scripts of esbuild and Biome, and a token
      # left on disk is readable by any code that runs after checkout.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Check (Biome lint + format)
        run: pnpm check

      # Integration tests are gated on a local Hermes binary (.hermes/hermes),
      # which is not committed — they skip automatically in CI.
      - name: Test
        run: pnpm test
